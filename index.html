<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📍Location Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1>📍 Location <span>Explorer</span></h1>
      <span id="status" class="status">Loading…</span>
    </div>

    <nav class="chips" id="chips">
      <button class="chip active" data-category="all">All</button>
      <button class="chip" data-category="park">🌳 Parks</button>
      <button class="chip" data-category="cafe">☕ Cafes</button>
      <button class="chip" data-category="museum">🏛️ Museums</button>
      <button class="chip" data-category="restaurant">🍽️ Restaurants</button>
    </nav>
    <div class="toolbar">
      <button id="nearbyBtn" class="chip" aria-pressed="false">📍 Nearby places</button>

      <div class="radius-wrap" id="radiusWrap" hidden>
        <label for="radius">Radius</label>
        <select id="radius">
          <option value="1">1 km</option>
          <option value="2">2 km</option>
          <option value="3">3 km</option>
          <option value="5" selected>5 km</option>
          <option value="Infinity">All</option>
        </select>
      </div>
    </div>
  </header>

  <main id="list"></main>

  <div id="sentinel" class="sentinel"><div class="spinner"></div></div>
  <button id="toTop" aria-label="Back to top">↑</button>

  <script type="module" src="src/main.js"></script>
</body>
</html>
